<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfuma | Luxury Fragrances</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://perfuma-fragrances.vercel.app/">

  <!-- Open Graph / Meta / Instagram / WhatsApp / Facebook / Snapchat -->
  <meta property="og:site_name" content="Perfuma">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://perfuma-fragrances.vercel.app/">
  <meta property="og:title" content="Perfuma ✨ | The Ultimate Luxury Fragrance Experience">
  <meta property="og:description" content="Discover our exclusive collection of handcrafted luxury perfumes & gift sets. Long-lasting, premium scents — designed in Paris, delivered to your door.">
  
  <!-- Image tag 1: High-res for Facebook, Instagram, LinkedIn, Snapchat (1200x630) -->
  <meta property="og:image" content="https://perfuma-fragrances.vercel.app/og-image.jpg">
  <meta property="og:image:secure_url" content="https://perfuma-fragrances.vercel.app/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Perfuma Luxury Fragrances Bottle">

  <!-- Schema.org Microdata for Google & WhatsApp -->
  <meta itemprop="name" content="Perfuma ✨ | The Ultimate Luxury Fragrance Experience">
  <meta itemprop="description" content="Discover our exclusive collection of handcrafted luxury perfumes & gift sets.">
  <meta itemprop="image" content="https://perfuma-fragrances.vercel.app/og-image.jpg">

  <!-- Twitter & Telegram Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@perfuma">
  <meta name="twitter:url" content="https://perfuma-fragrances.vercel.app/">
  <meta name="twitter:title" content="Perfuma ✨ | The Ultimate Luxury Fragrance Experience">
  <meta name="twitter:description" content="Discover our exclusive collection of handcrafted luxury perfumes & gift sets. Long-lasting, premium scents — designed in Paris, delivered to your door.">
  <meta name="twitter:image" content="https://perfuma-fragrances.vercel.app/og-image.jpg">
  <meta name="twitter:image:alt" content="Perfuma Luxury Fragrances Bottle">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Perfuma - The essence of elegance, bottled. Discover our luxury collection of handcrafted signature perfumes, gift sets, and more.">
  <meta name="keywords" content="perfume, luxury perfume, fragrance, gift sets, perfuma, buy perfume online">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Perfuma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
